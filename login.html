<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Supply Chain Disruption Response Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#EEF2FF',
              100: '#E0E7FF',
              200: '#C7D2FE',
              300: '#A5B4FC',
              400: '#818CF8',
              500: '#6366F1',
              600: '#4F46E5',
              700: '#4338CA',
              800: '#3730A3',
              900: '#312E81',
              950: '#1E1B4B',
            }
          }
        }
      }
    }
  </script>
  <script>
    if (localStorage.getItem('chainsolve_theme') === 'dark' || (!localStorage.getItem('chainsolve_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>
<body class="h-full flex items-center justify-center p-4 bg-[#F5F7FB] dark:bg-[#0B0F19] text-[#0F172A] dark:text-slate-100">

  <div class="enterprise-card max-w-md w-full p-8 space-y-6 shadow-xl">
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-2xl mx-auto shadow-md">
        ⚡
      </div>
      <h1 class="text-xl font-black text-slate-900 dark:text-white">Supply Chain Assistant</h1>
      <p class="text-xs text-slate-500">Sign in to access your role-based operations portal</p>
    </div>

    <!-- Quick Persona Selectors -->
    <div class="space-y-2">
      <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Quick Select Role Persona</label>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button onclick="setLogin('admin', 'Admin')" class="p-2.5 border border-slate-200 dark:border-slate-800 rounded-lg hover:border-indigo-600 text-left cursor-pointer transition">
          <strong class="block text-indigo-600 font-bold">👑 Admin</strong>
          <span class="text-[10px] text-slate-500">Full Access</span>
        </button>
        <button onclick="setLogin('manager', 'Supply Chain Manager')" class="p-2.5 border border-slate-200 dark:border-slate-800 rounded-lg hover:border-indigo-600 text-left cursor-pointer transition">
          <strong class="block text-indigo-600 font-bold">📦 Manager</strong>
          <span class="text-[10px] text-slate-500">Ops Controller</span>
        </button>
        <button onclick="setLogin('analyst', 'Analyst')" class="p-2.5 border border-slate-200 dark:border-slate-800 rounded-lg hover:border-indigo-600 text-left cursor-pointer transition">
          <strong class="block text-indigo-600 font-bold">📊 Analyst</strong>
          <span class="text-[10px] text-slate-500">Intake & Modeling</span>
        </button>
        <button onclick="setLogin('viewer', 'Viewer')" class="p-2.5 border border-slate-200 dark:border-slate-800 rounded-lg hover:border-indigo-600 text-left cursor-pointer transition">
          <strong class="block text-indigo-600 font-bold">👁️ Viewer</strong>
          <span class="text-[10px] text-slate-500">Read-Only</span>
        </button>
      </div>
    </div>

    <!-- Form -->
    <form onsubmit="handleLoginSubmit(event)" class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Username</label>
        <input type="text" id="loginUsername" required value="admin" class="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
      </div>
      <div>
        <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Password</label>
        <input type="password" id="loginPassword" required value="password123" class="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
      </div>

      <button type="submit" class="w-full btn-primary py-2.5 text-xs font-bold shadow-md cursor-pointer">
        Sign In to Portal ➔
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-100 dark:border-slate-800">
      <a href="./index.html" class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline font-bold">
        ← Return to Operations Console
      </a>
    </div>
  </div>

  <script>
    function setLogin(username, role) {
      document.getElementById('loginUsername').value = username;
      document.getElementById('loginPassword').value = 'password123';
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('loginUsername').value.trim();
      const p = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username: u, password: p })
        });
        if (res.ok) {
          window.location.href = './index.html';
        } else {
          alert('Invalid credentials.');
        }
      } catch (err) {
        window.location.href = './index.html';
      }
    }
  </script>
</body>
</html>
